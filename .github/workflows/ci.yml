name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse management scripts without executing them
        run: |
          for script in ./*.sh; do bash -n "$script"; done
      - name: Lint management scripts with shellcheck
        run: |
          for script in ./*.sh; do shellcheck "$script"; done
      - name: Lint and run tests
        run: |
          for script in ./tests/*.sh; do shellcheck "$script"; done
          for script in ./tests/*.sh; do bash "$script"; done
